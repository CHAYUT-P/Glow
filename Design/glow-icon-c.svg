<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Glow icon concept C: terminal window with tab bar and prompt -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#211D1B"/>
      <stop offset="100%" stop-color="#151211"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8A29E" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#A8A29E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A8A29E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="50" y="50" width="924" height="924" rx="188" fill="none" stroke="#3B3734" stroke-width="6"/>
  <!-- terminal window -->
  <rect x="192" y="248" width="640" height="528" rx="44" fill="#13100F"/>
  <!-- tab bar strip (chrome color) -->
  <rect x="192" y="248" width="640" height="118" rx="44" fill="#292524"/>
  <rect x="192" y="312" width="640" height="54" fill="#292524"/>
  <!-- tab pill -->
  <rect x="228" y="278" width="230" height="58" rx="14" fill="#3A3633"/>
  <!-- prompt inside the window -->
  <circle cx="664" cy="470" r="150" fill="url(#halo)"/>
  <path d="M 300 442 L 448 512 L 300 582"
        fill="none" stroke="#FAF9F8" stroke-width="58"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="512" y="452" width="40" height="120" rx="9" fill="#FAF9F8"/>
</svg>
