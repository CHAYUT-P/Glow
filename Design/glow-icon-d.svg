<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Glow icon concept D: two glowing cursors = a pair of eyes on black -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#211D1B"/>
      <stop offset="100%" stop-color="#151211"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8A29E" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#A8A29E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A8A29E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="50" y="50" width="924" height="924" rx="188" fill="none" stroke="#3B3734" stroke-width="6"/>
  <!-- left eye -->
  <circle cx="425" cy="512" r="185" fill="url(#halo)"/>
  <rect x="388" y="428" width="74" height="168" rx="16" fill="#FAF9F8"/>
  <!-- right eye -->
  <circle cx="599" cy="512" r="185" fill="url(#halo)"/>
  <rect x="562" y="428" width="74" height="168" rx="16" fill="#FAF9F8"/>
</svg>
